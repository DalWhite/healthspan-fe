<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>healthspan_fe_wasm_pwa</title>
    <base href="/" />
    <!-- Design system v1 (docs/design/DESIGN.md §2): Inter 400-800. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
        <link href="manifest.json" rel="manifest" />
        <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
        <link href="css/app.css" rel="stylesheet" />
</head>

<body>
  <div id="app">
    <!-- Carga percibida Tier-1 (t_fea01cd1, docs/design/skeleton-loading-spec.md):
         durante el arranque WASM (cold 11-16s) se muestra un esqueleto que imita el
         shell real (topbar 52px, sidebar 264px / bottom-nav 68px, bloques de altura
         fija según la ruta pedida). Sin requests ni assets nuevos: HTML estático +
         css/app.css, ya en la cadena render-blocking. Blazor monta sobre #app y lo
         reemplaza en un único commit de render: la sustitución no desplaza ningún
         elemento visible (aporta 0 a CLS). -->
    <div id="hs-boot-skeleton" data-hs-loading="boot" role="status" aria-busy="true">
      <div class="hs-boot-shell" aria-hidden="true">
        <div class="hs-boot-topbar hs-skeleton"></div>
        <aside class="hs-boot-sidebar hs-skeleton"></aside>
        <main class="hs-boot-page">
          <p class="hs-boot-status">Cargando Healthspan…</p>
          <div class="hs-boot-heading hs-skeleton"></div>
          <div class="hs-boot-blocks"></div>
        </main>
        <nav class="hs-boot-bottomnav hs-skeleton"></nav>
      </div>
      <noscript>
        <div class="noscript-warning">
          <h2>JavaScript is required</h2>
          <p>Esta aplicación requiere JavaScript para funcionar. Por favor, habilítalo en tu navegador.</p>
        </div>
      </noscript>
    </div>
  </div>
  <script>
    // Variante del esqueleto según la ruta pedida (sin requests extra). Las alturas
    // se fijan inline para que los bloques sean visibles incluso antes de que
    // app.css termine de aplicarse: la señal llega en <1s desde la navegación.
    (function () {
      var p = (location.pathname || '').replace(/\/+$/, '');
      var v = 'generic';
      if (/^\/training\/today/.test(p)) v = 'today';
      else if (/^\/wellbeing\/activities/.test(p) || /^\/training\/history/.test(p)) v = 'list';
      else if (/^\/training\/routines/.test(p)) v = 'cards';
      else if (/^\/profile/.test(p)) v = 'insights';
      else if (/^\/settings/.test(p)) v = 'settings';
      var el = document.getElementById('hs-boot-skeleton');
      if (!el) return;
      el.setAttribute('data-variant', v);
      var shapes = {
        today: [[3, 88], [120], [170]],
        list: [[56], [56], [56], [56], [56]],
        cards: [[140], [140], [140]],
        insights: [[3, 88], [260]],
        settings: [[100], [100], [100], [100]],
        generic: [[120], [120], [120]]
      };
      var host = el.querySelector('.hs-boot-blocks');
      (shapes[v] || shapes.generic).forEach(function (s) {
        if (s.length === 2) {
          var row = document.createElement('div');
          row.className = 'hs-boot-row';
          for (var i = 0; i < s[0]; i++) {
            var t = document.createElement('div');
            t.className = 'hs-skeleton hs-boot-tile';
            t.style.height = s[1] + 'px';
            row.appendChild(t);
          }
          host.appendChild(row);
        } else {
          var b = document.createElement('div');
          b.className = 'hs-skeleton hs-boot-block';
          b.style.height = s[0] + 'px';
          host.appendChild(b);
        }
      });
    })();
  </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script type="module">
        import sqlite3InitModule from './js/sqlite/sqlite3-api.mjs';
        globalThis.sqlite3InitModule = sqlite3InitModule;
    </script>
    <script src="js/sqlite/offline-db.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/googleAuth.js"></script>
    <script src="js/app.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>

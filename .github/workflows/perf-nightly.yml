name: Perf nightly (FE bench)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  fe_bench:
    if: github.event_name == 'schedule'  # PROBE-ONLY (t_4c61763c): off en dispatch de calibración
    runs-on: ubuntu-latest
    name: FE perf bench (navegador)
    # Serializado con el job perf_api_bench del workflow SWA (mismo group).
    # Evidencia t_4c61763c: nightly + bench de push concurrentes = API medida
    # bajo la carga del otro bench (15/16 PASS aislado vs 9/16 concurrente).
    # cancel-in-progress: false — el nightly no debe cancelar el gate de main.
    concurrency:
      group: perf-bench
      cancel-in-progress: false
    # 20 min: ~3 min install + 3 cold runs + 6 screens. El script es fail-fast
    # desde t_4c61763c: si el login no completa (regresion desplegada) aborta
    # en ~5 min en vez de quemar el presupuesto en reintentos (run 40393299266).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright + chromium
        run: pip install playwright && playwright install --with-deps chromium
      - name: FE perf bench
        run: python scripts/perf/fe_bench.py --cold 3 --out /tmp/fe_perf.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe_perf_json
          path: /tmp/fe_perf.json

  runner_warm_probe:
    # PROBE-ONLY (t_4c61763c): distribución TTFB warm del runner CI sobre la API
    # para fijar el umbral con evidencia. Este job NO debe existir en main.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Runner warm calibration probe
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: api_bench warm x2
        run: |
          python3 scripts/perf/api_bench.py --warmup 5 --iters 15 --out /tmp/api_perf_1.json || true
          python3 scripts/perf/api_bench.py --warmup 5 --iters 15 --out /tmp/api_perf_2.json || true
          cat /tmp/api_perf_1.json
          echo ====
          cat /tmp/api_perf_2.json
